mixed-port: 7890
allow-lan: false
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090
proxies: []
proxy-groups:
- name: ♻️ Auto
  type: url-test
  proxies:
  - DIRECT
  url: http://www.gstatic.com/generate_204
  interval: 300
- name: 🚀 Proxy
  type: select
  proxies:
  - ♻️ Auto
  - DIRECT
rules:
- MATCH,🚀 Proxy
