verify:
  # 0 = только TCP; 1 = +TLS для WL; 2 = +ядро (L2/L3) для ОБЩЕГО списка
  level: 2
  core_api: https://api.github.com/repos/MetaCubeX/mihomo/releases/latest
  controller: 127.0.0.1:19090
  mixed_port: 17890
  test_url: http://www.gstatic.com/generate_204
  geo_top: 0
  geo_url: https://api.ipify.org?format=json
  core_start_wait_s: 45

  l3:
    enabled: true
    telegram:
      - "https://api.telegram.org/robots.txt"
      - "https://api.telegram.org/"
    youtube:
      - "https://www.youtube.com/generate_204"
      - "https://i.ytimg.com/generate_204"
      - "https://yt3.ggpht.com/generate_204"
    sanity_check: true
    timeout_ms: 8000
    retries: 2
    only_alive: true
    # Режимы ОБЯЗАТЕЛЬНО в кавычках: YAML парсит off/on как булево.
    require_mode_all: "both"
    require_mode_wl: "off"
    tag_names: true
    min_keep_pct: 15
    all_keep_unchecked: true
    all_drop_dead: true

cache:
  enabled: true
  dir: .cache
  http_ttl_hours: 6
  ping_ok_ttl_hours: 12
  ping_fail_ttl_hours: 3
  content_hash: true

# Подписка, пустая after_empty прогонов подряд, пропускается на recheck_hours.
# Telegram-каналы не участвуют.
source_health:
  enabled: true
  after_empty: 10
  recheck_hours: 24

# Перекрывается переменными окружения
# TELEGRAM_API_ID / TELEGRAM_API_HASH / TELEGRAM_SESSION
telegram:
  api_id: 0
  api_hash: ""
  session_b64: ""

telethon:
  all_channels: true
  attachments: true
  attachment_ext: [".txt", ".json", ".yaml", ".yml", ".conf", ".list", ".sub", ""]

guards:
  enabled: true
  min_parse_rate: 0.6
  forbid_empty_wl: true
  max_all_drop_pct: 70

logging:
  debug: true
  show_live_sources: true
  live_sources_top: 0
  progress_every: 200
  diag_secrets: false

