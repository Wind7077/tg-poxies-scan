sources_file: sources.txt

outputs:
  all_txt: proxy-all.txt
  all_yaml: proxy-all.yaml
  wl_txt: proxy.txt
  wl_yaml: proxy.yaml
  best_txt: proxy-best.txt
  best_yaml: proxy-best.yaml
  wl_base64: proxy-base64.txt
  issue: issue.txt
  stats: stats.json
  live_sources: sources-live.txt

windows:
  wl_days: 50
  all_days: 10

limits:
  tme_pages: 10
  tme_sub_pages: 2
  telethon_limit: 1000
  max_embed: 200
  per_endpoint: 5
  best: 50
  best_source: "wl"
  max_attachment_mb: 2
  # Полный охват: кандидатов ~9200, проверяем всех. 0 = без лимита.
  core_max: 9000
  core_batch: 800
  core_retry_split: 2

concurrency:
  http: 50
  ping: 500
  tls: 100
  core: 64

timeouts:
  http_total: 12
  http_connect: 7
  long_total: 30
  ping: 2.0
  tls: 3.0
  core_delay_ms: 5000

protocols:
  all: [vless, vmess, ss, trojan, hysteria2, tuic]
  wl: [vless]

