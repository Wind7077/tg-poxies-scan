name: Update Proxies

on:
  schedule:
    # Каждые 1 час в 23 минуты (по UTC)
    - cron: '23 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run parser script
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: python main.py
        
      - name: Update timestamp
        run: |
          echo "Last update: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/last-run.txt
          
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add proxy.txt proxy.yaml .github/last-run.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update [skip ci]" && git push)
