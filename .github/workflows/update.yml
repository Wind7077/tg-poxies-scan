name: Update Proxies

on:
  schedule:
    # каждый час в 23 минуты (UTC)
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scanner/**'
      - 'tests/**'
      - 'config.yaml'
      - 'main.py'
      - 'conftest.py'
      - 'pytest.ini'
      - 'requirements.txt'
      - '.github/workflows/update.yml'

concurrency:
  group: update-proxies
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check layout
        run: |
          ls -la
          ls -la scanner
          python -c "import scanner; print('scanner OK:', scanner.__file__)"

      - name: Unit tests
        run: python -m pytest -q tests

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore scan cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: proxyscan-${{ github.run_id }}
          restore-keys: proxyscan-

      - name: Run scanner
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: python main.py

      - name: Commit and push
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for f in proxy.txt proxy.yaml proxy-all.txt proxy-all.yaml \
                   proxy-best.txt proxy-best.yaml proxy-base64.txt \
                   issue.txt stats.json sources-live.txt; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Auto-update proxies [skip ci]"
            git push || (git pull --rebase && git push)
          else
            echo "Нет изменений — коммит не нужен"
          fi
