name: Update Proxies

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scanner/**'
      - 'tests/**'
      - 'config.yaml'
      - 'main.py'
      - 'conftest.py'
      - 'pytest.ini'
      - 'requirements.txt'
      - '.github/workflows/update.yml'

concurrency:
  group: update-proxies
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt

      - name: Restore cache (http + ping + mihomo)
        uses: actions/cache@v4
        with:
          path: .cache
          key: scanner-cache-${{ github.run_id }}
          restore-keys: scanner-cache-

      - name: Run scanner
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: python main.py

      - name: Commit and push
        if: always()
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          FILES="proxy.txt proxy.yaml proxy-all.txt proxy-all.yaml \
                 proxy-best.txt proxy-best.yaml proxy-base64.txt \
                 issue.txt stats.json sources-live.txt"

          # 1. Сохраняем ТОЛЬКО реально изменённые артефакты вне репозитория.
          #    Если сработал guard и файлы не тронуты — сохранять нечего,
          #    и мы не откатим чужие более свежие списки.
          TMP=$(mktemp -d)
          n=0
          for f in $FILES; do
            [ -f "$f" ] || continue
            if [ -n "$(git status --porcelain -- "$f")" ]; then
              cp "$f" "$TMP/"
              n=$((n + 1))
            fi
          done
          if [ "$n" -eq 0 ]; then
            echo "Артефакты не изменились — коммит не нужен"
            exit 0
          fi
          echo "Сохранено изменённых артефактов: $n"

          # 2. Встаём на актуальный main (с вашими правками кода),
          #    кладём свои файлы поверх, коммитим. Никаких merge/rebase.
          attempt=1
          while [ "$attempt" -le 3 ]; do
            git fetch origin main
            git checkout -f -B main origin/main
            for f in $FILES; do
              [ -f "$TMP/$f" ] && cp "$TMP/$f" "$f"
            done
            for f in $FILES; do
              [ -f "$f" ] && git add "$f"
            done
            if git diff --staged --quiet; then
              echo "После синхронизации изменений нет — коммит не нужен"
              exit 0
            fi
            git commit -m "🤖 Auto-update proxies [skip ci]"
            if git push origin main; then
              echo "✅ запушено с попытки $attempt"
              exit 0
            fi
            echo "⚠️ push отклонён (попытка $attempt) — обновляемся и повторяем"
            attempt=$((attempt + 1))
            sleep 5
          done
          echo "❌ не удалось запушить за 3 попытки"
          exit 1
