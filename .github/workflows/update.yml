name: Update Proxies

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    paths: ['scanner/**', 'tests/**', 'config.yaml', 'main.py', '.github/workflows/update.yml']

concurrency:
  group: update-proxies
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q tests

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore scan cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: proxyscan-${{ github.run_id }}
          restore-keys: proxyscan-

      - name: Run scanner
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: python main.py

      - name: Commit and push
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add proxy.txt proxy.yaml proxy-all.txt proxy-all.yaml \
                  proxy-best.txt proxy-best.yaml proxy-base64.txt \
                  issue.txt stats.json sources-live.txt
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Auto-update proxies [skip ci]"
            git push || (git pull --rebase && git push)
          fi
