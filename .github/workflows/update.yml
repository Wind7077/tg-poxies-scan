name: Update Proxies

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache .cache (http ETag + ping)
        uses: actions/cache@v4
        with:
          path: .cache
          key: scanner-cache-${{ github.run_id }}
          restore-keys: scanner-cache-

      - name: Run parser script
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: python main.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          for f in proxy.txt proxy.yaml proxy-all.txt proxy-all.yaml issue.txt \
                   proxy-best.txt proxy-best.yaml proxy-base64.txt stats.json sources-live.txt; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update proxies [skip ci]" && git push)
