name: Update Proxies

on:
  schedule:
    - cron: '0 */5 * * *' # Запуск каждые 5 часов
  workflow_dispatch: # Кнопка для ручного запуска во вкладке Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Важно: дает право пушить изменения в репозиторий
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run parser script
        run: python main.py
        
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add proxy.txt proxy.yaml
          # Коммитим только если есть изменения
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update proxies [skip ci]" && git push)
